<!doctype html>
<!-- Generated from projects.yaml and src/index.template.html by npm run build. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fbf7ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
    <meta name="description" content="{{SITE_DESCRIPTION}}">
    <meta property="og:title" content="{{SITE_TITLE}}">
    <meta property="og:description" content="{{SITE_DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{SITE_LINK}}">
    <meta property="og:site_name" content="{{SITE_TITLE}}">
    <meta name="twitter:card" content="summary">
    <title>{{SITE_TITLE}}</title>
    <link rel="canonical" href="{{SITE_LINK}}">
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="main.css">
    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <button class="wordmark" type="button" aria-label="{{SITE_TITLE}}: play all project animations; hold to loop">
          {{WORDMARK}}
        </button>
      </header>

      <main>
        <h1 class="visually-hidden">Projects</h1>
        <div class="project-grid">
          {{PROJECT_CARDS}}
        </div>
      </main>
    </div>
  </body>
</html>
