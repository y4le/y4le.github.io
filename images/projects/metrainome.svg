<svg
  xmlns="http://www.w3.org/2000/svg"
  id="metrainome-card"
  viewBox="0 0 1618 1000"
  role="img"
  aria-labelledby="metrainome-card-title metrainome-card-description"
>
  <title id="metrainome-card-title">metrainome</title>
  <desc id="metrainome-card-description">
    The metrainome wordmark over a stylized stream of beats crossing a centered
    now axis, with fast, slow, and on-time timing marks.
  </desc>
  <style>
    :root {
      color-scheme: light dark;
      --card-ink: light-dark(#1a1814, #e8e3d5);
      --timing-early: light-dark(#b95416, #ff9a60);
      --timing-late: light-dark(#2f6fa8, #75b0ff);
    }

    :root[data-color-scheme="light"] {
      color-scheme: only light;
    }

    :root[data-color-scheme="dark"] {
      color-scheme: only dark;
    }

    #metrainome-card .mtrn-wordmark {
      fill: var(--card-ink);
      font-family: Geist, Inter, "Helvetica Neue", Arial, sans-serif;
      font-size: 236px;
      font-weight: 720;
      letter-spacing: -0.06em;
      transform-box: view-box;
      transform-origin: 809px 500px;
      animation: mtrn-wordmark-pulse 0.5s linear infinite;
    }

    #metrainome-card .mtrn-now {
      fill: none;
      stroke: var(--card-ink);
      stroke-linecap: square;
    }

    #metrainome-card .mtrn-now {
      stroke-opacity: 0.45;
      stroke-width: 4;
    }

    #metrainome-card .mtrn-beat-stream {
      animation: mtrn-beats-cross-now 8s linear infinite;
    }

    @keyframes mtrn-beats-cross-now {
      to {
        transform: translateX(-3200px);
      }
    }

    @keyframes mtrn-wordmark-pulse {
      0%,
      100% {
        transform: scale(1.008);
      }

      12%,
      88% {
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #metrainome-card .mtrn-beat-stream,
      #metrainome-card .mtrn-wordmark {
        animation: none;
      }
    }
  </style>

  <defs>
    <clipPath id="metrainome-card-frame-clip">
      <rect width="1618" height="1000" />
    </clipPath>

    <!-- Ends inside the NOW stroke so future results cannot bleed around it. -->
    <clipPath id="metrainome-card-past-results-clip">
      <rect width="806" height="1000" />
    </clipPath>

    <g
      id="metrainome-card-target-phrase"
      fill="none"
      stroke-linecap="square"
    >
      <path
        class="mtrn-target"
        d="M9 400V600 M209 400V600 M409 400V600 M609 400V600 M809 400V600 M1009 400V600 M1209 400V600 M1409 400V600 M1609 400V600 M1809 400V600 M2009 400V600 M2209 400V600 M2409 400V600 M2609 400V600 M2809 400V600 M3009 400V600"
        stroke="var(--card-ink)"
        stroke-opacity="0.26"
        stroke-width="3"
      />
    </g>

    <g
      id="metrainome-card-result-phrase"
      fill="none"
      stroke-linecap="square"
    >
      <!-- -44 ms: fast/early, 17.6px left of its target. -->
      <path
        class="mtrn-result--early"
        d="M-8.6 500V261"
        stroke="var(--timing-early)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- 0 ms: on time, exactly coincident with its target. -->
      <path
        class="mtrn-result--on-time"
        d="M209 400V600"
        stroke="var(--card-ink)"
        stroke-opacity="0.9"
        stroke-width="6"
      />
      <!-- +52 ms: slow/late, 20.8px right of its target. -->
      <path
        class="mtrn-result--late"
        d="M429.8 500V757"
        stroke="var(--timing-late)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- -72 ms: fast/early, 28.8px left of its target. -->
      <path
        class="mtrn-result--early"
        d="M580.2 500V198"
        stroke="var(--timing-early)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- +24 ms: slow/late, 9.6px right of its target. -->
      <path
        class="mtrn-result--late"
        d="M818.6 500V694"
        stroke="var(--timing-late)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- 0 ms: on time, exactly coincident with its target. -->
      <path
        class="mtrn-result--on-time"
        d="M1009 400V600"
        stroke="var(--card-ink)"
        stroke-opacity="0.9"
        stroke-width="6"
      />
      <!-- -18 ms: fast/early, 7.2px left of its target. -->
      <path
        class="mtrn-result--early"
        d="M1201.8 500V319.5"
        stroke="var(--timing-early)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- +68 ms: slow/late, 27.2px right of its target. -->
      <path
        class="mtrn-result--late"
        d="M1436.2 500V793"
        stroke="var(--timing-late)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- -36 ms: fast/early, 14.4px left of its target. -->
      <path
        class="mtrn-result--early"
        d="M1594.6 500V279"
        stroke="var(--timing-early)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- 0 ms: on time, exactly coincident with its target. -->
      <path
        class="mtrn-result--on-time"
        d="M1809 400V600"
        stroke="var(--card-ink)"
        stroke-opacity="0.9"
        stroke-width="6"
      />
      <!-- -28 ms: fast/early, 11.2px left of its target. -->
      <path
        class="mtrn-result--early"
        d="M1997.8 500V297"
        stroke="var(--timing-early)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- +76 ms: slow/late, 30.4px right of its target. -->
      <path
        class="mtrn-result--late"
        d="M2239.4 500V811"
        stroke="var(--timing-late)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- +43 ms: slow/late, 17.2px right of its target. -->
      <path
        class="mtrn-result--late"
        d="M2426.2 500V737"
        stroke="var(--timing-late)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- 0 ms: on time, exactly coincident with its target. -->
      <path
        class="mtrn-result--on-time"
        d="M2609 400V600"
        stroke="var(--card-ink)"
        stroke-opacity="0.9"
        stroke-width="6"
      />
      <!-- -45 ms: fast/early, 18px left of its target. -->
      <path
        class="mtrn-result--early"
        d="M2791 500V259"
        stroke="var(--timing-early)"
        stroke-opacity="0.85"
        stroke-width="5"
      />
      <!-- 0 ms: on time, exactly coincident with its target. -->
      <path
        class="mtrn-result--on-time"
        d="M3009 400V600"
        stroke="var(--card-ink)"
        stroke-opacity="0.9"
        stroke-width="6"
      />
    </g>
  </defs>

  <g clip-path="url(#metrainome-card-frame-clip)" aria-hidden="true">
    <g class="mtrn-beat-stream">
      <use href="#metrainome-card-target-phrase" x="-3200" />
      <use href="#metrainome-card-target-phrase" />
      <use href="#metrainome-card-target-phrase" x="3200" />
    </g>
    <g clip-path="url(#metrainome-card-past-results-clip)">
      <g class="mtrn-beat-stream">
        <use href="#metrainome-card-result-phrase" x="-3200" />
        <use href="#metrainome-card-result-phrase" />
        <use href="#metrainome-card-result-phrase" x="3200" />
      </g>
    </g>
    <path class="mtrn-now" d="M809 160V840" />
  </g>

  <text
    class="mtrn-wordmark"
    x="809"
    y="585"
    text-anchor="middle"
  >metrainome</text>
</svg>
