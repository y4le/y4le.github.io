<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1618 1000"
  role="img"
  aria-labelledby="countrain-card-title countrain-card-description"
  style="--train-period: 9s; --train-rest-x: 230px; overflow: hidden"
>
  <title id="countrain-card-title">countrain</title>
  <desc id="countrain-card-description">
    The centered countrain wordmark above a small train carrying blackjack
    cards on a railroad track.
  </desc>

  <!-- @control train-period min=4 max=16 step=0.5 unit=s -->
  <!-- @control train-rest-x min=190 max=270 step=10 unit=px -->

  <style>
    :root {
      color-scheme: light dark;
      --card-surface: light-dark(#fbf7ec, #0e0e0d);
      --card-ink: light-dark(#1a1814, #e8e3d5);
      --card-rule: light-dark(#d8d2c2, #2a2926);
      --card-rule-strong: light-dark(#bdb5a0, #403e39);
      --card-accent: #c1432e;
      --playing-card: light-dark(#ffffff, #faf6ea);
      --playing-card-ink: #1a1814;
    }

    :root[data-color-scheme="light"] {
      color-scheme: only light;
    }

    :root[data-color-scheme="dark"] {
      color-scheme: only dark;
    }

    .wordmark {
      fill: var(--card-ink);
      font-family: Geist, Inter, 'Helvetica Neue', Arial, sans-serif;
      font-size: 236px;
      font-weight: 720;
      letter-spacing: -0.06em;
    }

    .train {
      --train-travel-x: 780px;
      --train-exit-x: calc(var(--train-rest-x) + var(--train-travel-x));
      --train-entry-x: calc(var(--train-rest-x) - var(--train-travel-x));
      transform: translateX(var(--train-rest-x));
      animation: train-loop var(--train-period) linear infinite;
    }

    .train-body {
      fill: var(--card-ink);
      stroke: var(--card-ink);
      stroke-width: 5;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .connector {
      stroke: var(--card-ink);
      stroke-width: 8;
      stroke-linecap: round;
    }

    .card {
      fill: var(--playing-card);
      stroke: var(--playing-card-ink);
      stroke-width: 4;
    }

    .card-text {
      font-family: Geist, Inter, Arial, Helvetica, sans-serif;
      font-size: 22px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .card-black {
      fill: var(--playing-card-ink);
    }

    .card-red {
      fill: var(--card-accent);
    }

    .window {
      fill: var(--card-surface);
    }

    .wheel {
      fill: var(--card-surface);
      stroke: var(--card-ink);
      stroke-width: 8;
    }

    .hub {
      fill: var(--card-ink);
    }

    .rail {
      stroke: var(--card-rule-strong);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .tie {
      stroke: var(--card-rule);
      stroke-width: 6;
      stroke-linecap: round;
    }

    @keyframes train-loop {
      0% {
        transform: translateX(var(--train-rest-x));
        animation-timing-function: cubic-bezier(0.45, 0.05, 0.8, 0.4);
      }

      30% {
        transform: translateX(var(--train-exit-x));
        animation-timing-function: step-end;
      }

      38% {
        transform: translateX(var(--train-entry-x));
        animation-timing-function: cubic-bezier(0.2, 0.6, 0.55, 0.95);
      }

      68%,
      100% {
        transform: translateX(var(--train-rest-x));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .train {
        animation: none;
      }
    }
  </style>

  <text class="wordmark" x="809" y="585" text-anchor="middle">countrain</text>

  <g transform="scale(1.618)">
    <g transform="translate(0 50)">
      <g aria-hidden="true" opacity="0.82">
        <line class="tie" x1="130" y1="507" x2="130" y2="543" />
        <line class="tie" x1="178" y1="507" x2="178" y2="543" />
        <line class="tie" x1="226" y1="507" x2="226" y2="543" />
        <line class="tie" x1="274" y1="507" x2="274" y2="543" />
        <line class="tie" x1="322" y1="507" x2="322" y2="543" />
        <line class="tie" x1="370" y1="507" x2="370" y2="543" />
        <line class="tie" x1="418" y1="507" x2="418" y2="543" />
        <line class="tie" x1="466" y1="507" x2="466" y2="543" />
        <line class="tie" x1="514" y1="507" x2="514" y2="543" />
        <line class="tie" x1="562" y1="507" x2="562" y2="543" />
        <line class="tie" x1="610" y1="507" x2="610" y2="543" />
        <line class="tie" x1="658" y1="507" x2="658" y2="543" />
        <line class="tie" x1="706" y1="507" x2="706" y2="543" />
        <line class="tie" x1="754" y1="507" x2="754" y2="543" />
        <line class="tie" x1="802" y1="507" x2="802" y2="543" />
        <line class="tie" x1="850" y1="507" x2="850" y2="543" />

        <line class="rail" x1="92" y1="514" x2="908" y2="514" />
        <line class="rail" x1="92" y1="536" x2="908" y2="536" />
      </g>

      <g class="train" aria-hidden="true">
    <g transform="translate(20 0)">
      <path class="train-body" d="M18 438 H116 L106 488 H28 Z" />

      <g transform="rotate(-8 50 418)">
        <rect class="card" x="28" y="374" width="48" height="72" rx="8" />
        <text class="card-text card-black" x="52" y="396">10</text>
        <text class="card-text card-black" x="52" y="420">♠</text>
      </g>

      <g transform="rotate(8 86 418)">
        <rect class="card" x="64" y="374" width="48" height="72" rx="8" />
        <text class="card-text card-red" x="88" y="396">A</text>
        <text class="card-text card-red" x="88" y="420">♥</text>
      </g>

      <circle class="wheel" cx="46" cy="498" r="18" />
      <circle class="hub" cx="46" cy="498" r="6" />
      <circle class="wheel" cx="96" cy="498" r="18" />
      <circle class="hub" cx="96" cy="498" r="6" />
    </g>

    <line class="connector" x1="138" y1="468" x2="156" y2="468" />

    <g transform="translate(154 0)">
      <path class="train-body" d="M18 438 H116 L106 488 H28 Z" />

      <g transform="rotate(-7 52 418)">
        <rect class="card" x="28" y="374" width="48" height="72" rx="8" />
        <text class="card-text card-black" x="52" y="396">K</text>
        <text class="card-text card-black" x="52" y="420">♣</text>
      </g>

      <g transform="rotate(7 88 418)">
        <rect class="card" x="64" y="374" width="48" height="72" rx="8" />
        <text class="card-text card-red" x="88" y="396">2</text>
        <text class="card-text card-red" x="88" y="420">♦</text>
      </g>

      <circle class="wheel" cx="46" cy="498" r="18" />
      <circle class="hub" cx="46" cy="498" r="6" />
      <circle class="wheel" cx="96" cy="498" r="18" />
      <circle class="hub" cx="96" cy="498" r="6" />
    </g>

    <line class="connector" x1="272" y1="468" x2="292" y2="468" />

    <g transform="translate(292 0)">
      <rect class="train-body" x="18" y="426" width="88" height="72" rx="7" />
      <rect class="train-body" x="76" y="390" width="52" height="108" rx="6" />
      <rect class="window" x="88" y="406" width="28" height="28" rx="4" />
      <rect class="train-body" x="108" y="420" width="68" height="78" rx="36" />
      <rect class="train-body" x="142" y="372" width="20" height="54" rx="5" />
      <rect class="train-body" x="134" y="369" width="36" height="12" rx="5" />
      <polygon class="train-body" points="178,462 210,498 176,498" />

      <circle class="wheel" cx="54" cy="500" r="24" />
      <circle class="hub" cx="54" cy="500" r="8" />
      <circle class="wheel" cx="108" cy="500" r="20" />
      <circle class="hub" cx="108" cy="500" r="7" />
      <circle class="wheel" cx="154" cy="500" r="20" />
      <circle class="hub" cx="154" cy="500" r="7" />
    </g>
      </g>
    </g>
  </g>
</svg>
