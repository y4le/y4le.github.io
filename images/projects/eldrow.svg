  <title id="eldrow-card-title">Eldrow</title>
  <desc id="eldrow-card-description">The Eldrow wordmark beneath two real feedback splits, drawn like Eldrow's game flow. TRAIN splits the 2,315 bundled Wordle answers into 137 feedback groups, shown as one bar of proportional slices ordered by size. Its highlighted slice, where T, R and A are present but misplaced, keeps 24 answers and expands into the next bar. WATER, a common follow-up rather than the solver's choice, splits those 24 into 14 groups; a gray W with green A, T, E and R leaves 4 answers, and the game is unfinished. The cycle rewinds to TRAIN's bar and replays the expansion.</desc>
  <!-- Generated by scripts/card_svg.py from `eldrow partitions`; edit the script. -->
  <style>
    :root,
    #eldrow-card {
      color-scheme: light dark;
      --card-ink: light-dark(#1a1814, #e8e3d5);
      --card-bar: light-dark(#575247, #aaa497);
      --card-accent: light-dark(#c1432e, #d9644d);
      --card-ribbon: light-dark(rgb(193 67 46 / 0.12), rgb(217 100 77 / 0.18));
      --card-gray: light-dark(#797c71, #5a5c52);
      --card-yellow: light-dark(#b38b29, #b19443);
      --card-green: light-dark(#468064, #49785f);
    }
    :root[data-color-scheme="light"],
    #eldrow-card[data-color-scheme="light"] { color-scheme: only light; }
    :root[data-color-scheme="dark"],
    #eldrow-card[data-color-scheme="dark"] { color-scheme: only dark; }

    .wordmark {
      fill: var(--card-ink);
      font-family: Geist, Inter, 'Helvetica Neue', Arial, sans-serif;
      font-size: 236px;
      font-weight: 720;
      letter-spacing: -0.06em;
    }
    .gray { fill: var(--card-gray); }
    .yellow { fill: var(--card-yellow); }
    .green { fill: var(--card-green); }
    .letters {
      fill: #fff;
      font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 42px;
      font-weight: 600;
      text-anchor: middle;
    }
    .count { fill: var(--card-ink); font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 40px; }
    .slices { fill: var(--card-bar); }
    .chosen { fill: var(--card-accent); stroke: var(--card-accent); stroke-width: 5; }
    .ribbon { fill: var(--card-ribbon); }
    .edge {
      fill: none;
      stroke: var(--card-accent);
      stroke-opacity: 0.5;
      stroke-width: 3;
      stroke-dasharray: 1 1;
    }

    /* One 6s timeline, no delays. The resting frame is the complete two-row
       flow, which is also every keyframe set's 0% and 100%: the cycle rewinds to
       TRAIN's bar, then replays the selection and expansion. */
    .pick1, .ribbon, .edge, .bar2, .fade2, .row2, .pick2 {
      animation-duration: 6s;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1);
    }
    .pick1 { animation-name: pick1; }
    .ribbon { animation-name: ribbon; }
    .edge { animation-name: edge; }
    .bar2 { transform-box: view-box; transform-origin: 0 0; animation-name: expand; }
    .fade2 { animation-name: fade2; }
    .row2 { animation-name: row2; }
    .pick2 { animation-name: pick2; }

    @keyframes pick1 {
      0%, 18% { opacity: 1; }
      26%, 34% { opacity: 0; }
      42%, 100% { opacity: 1; }
    }
    @keyframes ribbon {
      0%, 4% { opacity: 1; }
      10%, 56% { opacity: 0; }
      64%, 100% { opacity: 1; }
    }
    @keyframes edge {
      0%, 6% { stroke-dashoffset: 0; }
      20%, 44% { stroke-dashoffset: 1; }
      60%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes expand {
      0%, 8% { transform: none; }
      22%, 44% { transform: translateX(1213.65px) scaleX(0.0103672); }
      60%, 100% { transform: none; }
    }
    @keyframes fade2 {
      0%, 14% { opacity: 1; }
      22%, 44% { opacity: 0; }
      47%, 100% { opacity: 1; }
    }
    @keyframes row2 {
      0%, 4% { opacity: 1; }
      12%, 58% { opacity: 0; }
      66%, 100% { opacity: 1; }
    }
    @keyframes pick2 {
      0%, 4% { opacity: 1; }
      12%, 64% { opacity: 0; }
      72%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pick1, .ribbon, .edge, .bar2, .fade2, .row2, .pick2 { animation: none; }
    }
  </style>

