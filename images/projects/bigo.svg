<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1618 1000"
  role="img"
  aria-labelledby="bigo-card-title bigo-card-description"
>
  <title id="bigo-card-title">bigO</title>
  <desc id="bigo-card-description">
    A log-log growth frame behind the bigO wordmark. Seven representative cost
    models — O(1), O(log n), O(n), O(n log n), O(n²), O(2ⁿ), and O(n!) — are
    present in the first frame. O(square root n), O(n to the 1.5), and O(n
    cubed) are then added in turn, showing polynomial exponent as a continuous
    dial. The finite window compares growth from 1 to 10,000 inputs and does not
    prove an asymptotic limit. Curves are clipped at the exact window
    boundaries; the n! trace uses Γ(n+1) only to interpolate between integer
    inputs.
  </desc>
  <style>
    :root {
      color-scheme: light dark;
      --card-ink: light-dark(#1a1814, #e8e3d5);
      --card-muted: light-dark(#6f6a5e, #8a857a);
      --card-rule: light-dark(#d8d2c2, #2a2926);
      --card-accent: #c1432e;
    }

    :root[data-color-scheme="light"] {
      color-scheme: only light;
    }

    :root[data-color-scheme="dark"] {
      color-scheme: only dark;
    }

    .word {
      fill: var(--card-ink);
      font-family: Geist, Inter, 'Helvetica Neue', Arial, sans-serif;
      font-size: 236px;
      font-weight: 720;
      letter-spacing: -0.06em;
    }

    .window {
      fill: none;
      stroke: var(--card-rule);
      stroke-width: 2;
    }

    .axis,
    .curve__label {
      fill: var(--card-muted);
      font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo,
        Consolas, 'Liberation Mono', monospace;
    }

    .axis {
      font-size: 22px;
    }

    .curve {
      fill: none;
    }

    .curve--stable {
      stroke: var(--card-muted);
      stroke-width: 3;
    }

    .curve__label {
      font-size: 32px;
    }

    .curve--intermediate {
      stroke: var(--card-muted);
      stroke-opacity: 0.5;
      stroke-width: 2;
      animation: draw-curve 1.3s ease-out forwards;
    }

    .curve__label--intermediate {
      font-size: 30px;
      opacity: 0;
      animation: reveal-curve-label 1.3s ease-out forwards;
    }

    .curve--root,
    .curve__label--root {
      animation-delay: 0.6s;
    }

    .curve--root {
      stroke-dasharray: 1181;
      stroke-dashoffset: 1181;
    }

    .curve--three-halves,
    .curve__label--three-halves {
      animation-delay: 1.9s;
    }

    .curve--three-halves {
      stroke-dasharray: 1350;
      stroke-dashoffset: 1350;
    }

    .curve--cubic,
    .curve__label--cubic {
      animation-delay: 3.2s;
    }

    .curve--cubic {
      stroke-dasharray: 1054;
      stroke-dashoffset: 1054;
    }

    @keyframes draw-curve {
      0% {
        stroke: var(--card-accent);
        stroke-opacity: 1;
        stroke-width: 3.5;
      }

      77% {
        stroke: var(--card-accent);
        stroke-dashoffset: 0;
        stroke-opacity: 1;
        stroke-width: 3.5;
      }

      100% {
        stroke: var(--card-muted);
        stroke-dashoffset: 0;
        stroke-opacity: 0.5;
        stroke-width: 2;
      }
    }

    @keyframes reveal-curve-label {
      0% {
        fill: var(--card-muted);
        opacity: 0;
      }

      60% {
        fill: var(--card-accent);
        opacity: 0;
      }

      77% {
        fill: var(--card-accent);
        opacity: 1;
      }

      100% {
        fill: var(--card-muted);
        opacity: 0.7;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .curve--intermediate,
      .curve__label--intermediate {
        animation: none;
      }

      .curve.curve--intermediate {
        stroke-dashoffset: 0;
      }

      .curve__label--intermediate {
        opacity: 0.7;
      }
    }
  </style>
  <defs>
    <clipPath id="plot-window" clipPathUnits="userSpaceOnUse">
      <rect x="90" y="94" width="1162" height="812" />
    </clipPath>
  </defs>

