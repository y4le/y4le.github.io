<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1618 1000"
  class="catalog-card"
  role="img"
  aria-labelledby="title description"
  style="--ink-light: #1a1814; --ink-dark: #e8e3d5; --muted-light: #6f6a5e; --muted-dark: #8a857a; --faint-light: #b3ad9b; --faint-dark: #54524c; --rule-light: #d8d2c2; --rule-dark: #2a2926; --accent: #c1432e; --rule-width: 2px; --mark-size: 236px; --mark-weight: 720; --mark-tracking: -0.06em; --period: 4s"
>
  <title id="title">svg</title>
  <desc id="description">
    SVG source on the left renders a rotating svg word on the right.
  </desc>
  <!-- @control rule-width min=0.5 max=5 step=0.5 -->
  <!-- @control mark-size min=140 max=320 step=4 -->
  <!-- @control mark-weight min=300 max=900 step=10 -->
  <!-- @control mark-tracking min=-0.12 max=0.03 step=0.005 -->
  <!-- @control period min=1 max=12 step=0.25 -->
  <style>
    .catalog-card {
      color-scheme: light dark;
      --card-ink: light-dark(var(--ink-light), var(--ink-dark));
      --card-muted: light-dark(var(--muted-light), var(--muted-dark));
      --card-faint: light-dark(var(--faint-light), var(--faint-dark));
      --card-rule: light-dark(var(--rule-light), var(--rule-dark));
      color: var(--card-ink);
      font-family: Geist, Inter, 'Helvetica Neue', Arial, sans-serif;
    }

    .catalog-card[data-color-scheme="light"] {
      color-scheme: only light;
    }

    .catalog-card[data-color-scheme="dark"] {
      color-scheme: only dark;
    }

    .ink {
      fill: var(--card-ink);
    }

    .muted {
      fill: var(--card-muted);
    }

    .faint {
      fill: var(--card-faint);
    }

    .accent {
      fill: var(--accent);
    }

    .frame-rule {
      fill: none;
      stroke: var(--card-faint);
      stroke-width: var(--rule-width);
      vector-effect: non-scaling-stroke;
    }

    .quiet-rule {
      fill: none;
      stroke: var(--card-rule);
      stroke-width: var(--rule-width);
      vector-effect: non-scaling-stroke;
    }

    .code {
      font-family: "Courier New", Courier, monospace;
      font-size: 22px;
    }

    .rendered-mark {
      font-size: var(--mark-size);
      font-weight: var(--mark-weight);
      letter-spacing: var(--mark-tracking);
      transform-box: view-box;
      transform-origin: 1190px 500px;
      animation: rotate var(--period) linear infinite;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rendered-mark {
        animation: none;
      }
    }
  </style>

  <path class="frame-rule" d="M48 48H1570V952H48ZM809 48V952" />

  <g class="code" aria-label="SVG source code">
    <text class="muted" x="98" y="128">&lt;svg viewBox="0 0 400 240"&gt;</text>
    <text class="muted" x="124" y="178">&lt;style&gt;</text>
    <text class="ink" x="150" y="228">.mark {</text>
    <text class="ink" x="176" y="278">font: 700 112px sans-serif;</text>
    <text class="ink" x="176" y="328">transform-origin: center;</text>
    <rect class="accent" x="157" y="350" width="3" height="31" />
    <text class="ink" x="176" y="378">animation: rotate 4s linear infinite;</text>
    <text class="ink" x="150" y="428">}</text>
    <text class="ink" x="150" y="478">@keyframes rotate {</text>
    <text class="ink" x="176" y="528">to { transform: rotate(360deg); }</text>
    <text class="ink" x="150" y="578">}</text>
    <text class="muted" x="124" y="628">&lt;/style&gt;</text>
    <text class="ink" x="124" y="704">&lt;text class="mark" x="200" y="154"</text>
    <text class="ink" x="176" y="754">text-anchor="middle"&gt;svg&lt;/text&gt;</text>
    <text class="muted" x="98" y="864">&lt;/svg&gt;</text>
  </g>

  <g aria-label="Rendered rotating svg text">
    <path class="quiet-rule" d="M890 500H1490M1190 200V800" />
    <circle class="quiet-rule" cx="1190" cy="500" r="300" />
    <circle class="faint" cx="1190" cy="500" r="6" />
    <text
      class="rendered-mark ink"
      x="1190"
      y="585"
      text-anchor="middle"
      aria-label="svg"
    >
      svg
    </text>
  </g>
</svg>
