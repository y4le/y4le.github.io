# Hand-edited site configuration. npm run manifest never writes this file.

site:
  title: YaleThom.as
  description: "Interactive tools, visualizations, and experiments by Yale Thomas."
  link: https://yalethom.as/

# Pinned display order, listed by project slug (the path segment of the
# canonical link). Projects in order render first; unordered projects follow
# by recency; projects in last always render at the end. Slugs that match no
# project in projects.yaml are reported and ignored.
order:
  - magnitude
  - textTrends
  - graphtv
  - metrainome
  - countrain
  - bigO
  - svg
  - txtop
  - veil
last:
  - resume
