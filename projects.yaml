  - schema: 1
    title: bigO
    description: Sweep a step budget across thirty orders of magnitude to see how much input each growth model can handle.
    bullets:
      - Sweeps one shared step budget from 1 to 1e30 and reports the largest input each model can handle.
      - Computes tagged log-space magnitudes and marks unsafe counts approximate, so no result appears as false precision, NaN, or Infinity.
      - Derives every model label and capacity in the visualization from one typed registry.
      - Finds exact integer capacity boundaries, separating 39,620,077 from 39,620,078 at a billion steps without tolerances.
      - Runs in the browser with no runtime dependencies and no network requests.
    date:
      start: "2026-08"
      end: "present"
    link: https://yalethom.as/bigo/
    type: visualization
    tags:
